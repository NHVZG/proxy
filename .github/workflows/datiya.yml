name: Update Datiya Config

on:
  schedule:
    - cron: "0 22 * * *"  # 北京 06:00
    - cron: "0 14 * * *"  # 北京 22:00
  workflow_dispatch:  # 允许手动触发

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v3

      - name: 确保 uploads 目录存在
        run: mkdir -p uploads

      - name: 获取最新 Clash & V2Ray 配置
        run: |
          TODAY=$(date +"%Y%m%d")
          HOUR=$(date +"%H")
          if [ "$HOUR" = "22" ]; then
            TODAY=$(date -d "+1 day" +"%y%m%d")
          fi
          CLASH_LATEST_URL="https://free.datiya.com/uploads/${TODAY}-clash.yaml"
          V2RAY_LATEST_URL="https://free.datiya.com/uploads/${TODAY}-v2ray.txt"
          CLASH_SAVE_PATH="uploads/datiya-clash.yaml"
          V2RAY_SAVE_PATH="uploads/datiya-v2ray.txt"
          echo "🔍 正在下载datiya Clash 配置: $CLASH_LATEST_URL"
          if curl -o "$CLASH_SAVE_PATH" -L --fail "$CLASH_LATEST_URL"; then
            echo "✅ Clash 配置下载成功: $CLASH_SAVE_PATH"
          else
            echo "❌ Clash 配置下载失败，跳过更新"
            exit 0
          fi
          echo "🔍 正在下载 V2Ray 配置: $V2RAY_LATEST_URL"
          if curl -o "$V2RAY_SAVE_PATH" -L --fail "$V2RAY_LATEST_URL"; then
            echo "✅ V2Ray 配置下载成功: $V2RAY_SAVE_PATH"
          else
            echo "❌ V2Ray 配置下载失败，跳过此文件更新"
          fi
      - name: 自动修改 Clash 配置（修改 interval）
        run: |
          # 修改 interval: 300 -> 30 秒 自动选择
          sed -i 's/interval: 300/interval: 30/' uploads/datiya-clash.yaml
          echo "✅ 配置已修改：interval 设为 3600"
      - name: 提交更新（仅当文件有变更）
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          if git diff --quiet uploads/datiya-clash.yaml; then
            echo "⚠️ 配置文件无变化，跳过提交"
            exit 0
          fi
          git add uploads/datiya-clash.yaml uploads/datiya-v2ray.txt
          git commit -m "更新配置文件: $TODAY"
          git push
